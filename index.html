<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123a63"><link rel="manifest" href="manifest.webmanifest"><title>SIS Terpadu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
:root{--nav:#123a63;--nav2:#0c2947;--accent:#2563eb;--bg:#f4f7fb;--card:#fff;--text:#162334;--muted:#64748b;--line:#e2e8f0;--ok:#15803d;--warn:#b45309;--danger:#b91c1c;--info:#0369a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700}.ghost{background:#eef2f7;color:#1e293b}.danger{background:#b91c1c}.success{background:#15803d}.warn{background:#b45309}.wrap{display:flex;min-height:100vh}.side{width:260px;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#fff;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:900;font-size:19px;margin-bottom:4px}.side small{color:#cbd5e1}.nav{margin-top:18px}.nav button{display:block;width:100%;text-align:left;background:transparent;margin:3px 0;color:#dbeafe}.nav button.active,.nav button:hover{background:#ffffff1a}.main{flex:1;padding:22px;max-width:1600px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.title{font-size:26px;font-weight:900}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 18px #0f172a0a;margin-bottom:14px}.kpi{font-size:30px;font-weight:900;margin-top:8px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{padding:10px 11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.field textarea{min-height:95px;resize:vertical}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}.table th{background:#f8fafc}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#e2e8f0;font-size:12px;font-weight:700}.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.pill.info{background:#e0f2fe;color:#075985}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#dbeafe,#f4f7fb 45%)}.login .card{width:min(470px,100%)}.login h1{margin:0 0 8px}.hidden{display:none!important}.notice{padding:11px 13px;border-radius:10px;background:#eff6ff;color:#1d4ed8;margin-bottom:14px}.error{background:#fef2f2;color:#b91c1c}.successmsg{background:#f0fdf4;color:#166534}.actions{display:flex;gap:7px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#02061780;display:grid;place-items:center;padding:20px;z-index:20}.modal .card{width:min(1000px,100%);max-height:92vh;overflow:auto}.section{margin-top:20px}.empty{padding:35px;text-align:center;color:var(--muted)}.hero{background:linear-gradient(135deg,#123a63,#2563eb);color:#fff}.hero .sub{color:#dbeafe}.statline{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}.bar{height:9px;border-radius:20px;background:#e2e8f0;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.search{max-width:320px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.printonly{display:none}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.side{width:230px}}@media(max-width:700px){.wrap{display:block}.side{width:100%;height:auto;position:relative}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.main{padding:14px}.grid,.grid2,.grid3{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.table{min-width:850px}.card:has(.table){overflow:auto}.search{max-width:none;width:100%}}
@media print{.side,.top button,#nav,#syncStatus,.no-print{display:none!important}.main{max-width:none;padding:0}.printonly{display:block}.card{box-shadow:none}}
</style></head>
<body>
<div id="login" class="login"><div class="card"><div class="pill info">SIS TERPADU • V2.1</div><h1>Sistem Sekolah Online Terpadu</h1><p class="sub">Database pusat • Auth • RLS • PWA • Dashboard sekolah</p><div id="loginMsg"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="admin@sekolah.sch.id"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div><div class="actions"><button id="loginBtn">Masuk</button><button class="ghost" id="forgotBtn">Lupa password</button></div><p class="sub" style="font-size:12px;margin-top:14px">Akun produksi sebaiknya dibuat oleh Admin/Supabase Dashboard. Jangan memasukkan secret/service-role key ke browser.</p></div></div>
<div id="app" class="wrap hidden"><aside class="side"><div class="brand">SIS TERPADU</div><small id="who"></small><div class="nav" id="nav"></div><button class="ghost" id="logout" style="width:100%;margin-top:15px">Keluar</button></aside><main class="main"><div class="top"><div><div class="title" id="pageTitle">Dashboard</div><div class="sub" id="schoolName"></div></div><div><span id="syncStatus" class="pill">Online</span></div></div><div id="content"></div></main></div>
<div id="modal" class="modal hidden"><div class="card"><div id="modalBody"></div></div></div>

<script>
const C=window.APP_CONFIG||{};
let sb=null,session=null,profile=null,school=null,teacherMe=null,studentMe=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID'):'-';
const readyConfig=()=>C.SUPABASE_URL&&C.SUPABASE_PUBLISHABLE_KEY&&!C.SUPABASE_URL.includes('GANTI_')&&!C.SUPABASE_PUBLISHABLE_KEY.includes('GANTI_');

function msg(t,c='notice'){return `<div class="${c}">${esc(t)}</div>`}
function closeModal(){$('modal').classList.add('hidden')}

function navItems(){
  const r=profile?.role;
  let a=[['dashboard','Dashboard'],['announcements','Pengumuman'],['calendar','Kalender']];
  if(['ADMIN','KEPALA_SEKOLAH','GURU','WALI_KELAS'].includes(r))a.push(['students','Peserta Didik'],['classes','Kelas'],['subjects','Mata Pelajaran'],['teachers','Guru']);
  if(['GURU','WALI_KELAS','ADMIN'].includes(r))a.push(['modules','Modul Pembelajaran'],['attendance','Absensi'],['grades','Nilai & Asesmen'],['followups','Tindak Lanjut']);
  if(['ADMIN','KEPALA_SEKOLAH'].includes(r))a.push(['programs','Program Sekolah'],['supervision','Supervisi'],['performance','Kinerja Guru'],['decisions','Keputusan Data'],['reports','Laporan']);
  if(r==='ADMIN')a.push(['users','Pengguna'],['audit','Audit Log'],['settings','Pengaturan']);
  if(['ORANG_TUA','SISWA'].includes(r))a.push(['mydata','Data Saya'],['myattendance','Kehadiran'],['mygrades','Nilai']);
  return a;
}

function buildNav(){
  $('nav').innerHTML=navItems().map(x=>`<button data-page="${x[0]}">${x[1]}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>route(b.dataset.page));
}

async function q(table,opts={}){
  let query=sb.from(table).select(opts.select||'*');
  if(opts.eq)Object.entries(opts.eq).forEach(([k,v])=>query=query.eq(k,v));
  if(opts.order)query=query.order(opts.order[0],{ascending:opts.order[1]!==false});
  if(opts.limit)query=query.limit(opts.limit);
  const {data,error}=await query;
  if(error)throw error;
  return data||[];
}

async function one(table,opts={}){const a=await q(table,{...opts,limit:1});return a[0]||null}
async function ins(table,row){const {data,error}=await sb.from(table).insert(row).select().single();if(error)throw error;return data}
async function del(table,id){const {error}=await sb.from(table).delete().eq('id',id);if(error)throw error;}

async function init(){
  if(!readyConfig()){
    $('loginMsg').innerHTML=msg('Isi config.js dengan Project URL dan Publishable Key Supabase.');$('loginBtn').disabled=true;
    return;
  }
  sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  
  $('loginBtn').onclick=async()=>{
    const email=$('email').value, password=$('password').value;
    $('loginMsg').innerHTML=msg('Sedang memproses...','notice');
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){ $('loginMsg').innerHTML=msg(error.message,'notice error'); }
    else{ await enter(data.session); }
  };

  $('logout').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };

  const {data}=await sb.auth.getSession();
  if(data?.session) await enter(data.session);
}

async function enter(s){
  session=s;
  try{
    profile=await one('profiles',{eq:{id:s.user.id}});
    if(!profile||!profile.active||!profile.school_id) throw new Error('Profil belum diaktifkan atau belum memiliki school_id.');
    school=await one('schools',{eq:{id:profile.school_id}});
    $('who').textContent=`${profile.full_name||profile.email} • ${profile.role}`;
    $('schoolName').textContent=school?.name||'Sekolah';
    $('login').classList.add('hidden');$('app').classList.remove('hidden');
    buildNav();
    route('dashboard');
  }catch(e){
    $('loginMsg').innerHTML=msg(e.message||'Gagal memuat profil','notice error');
  }
}

function route(page){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  $('pageTitle').textContent=navItems().find(x=>x[0]===page)?.[1]||'Dashboard';
  (pages[page]||pages.dashboard)().catch(e=>{$('content').innerHTML=msg(e.message||'Terjadi kesalahan','notice error')});
}

function tableCard(title,headers,rows,buttons=''){
  return `<div class="card"><div class="top"><h3 style="margin:0">${esc(title)}</h3>${buttons}</div><div style="overflow:auto"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">Belum ada data.</td></tr>`}</tbody></table></div></div>`;
}

function btn(t,fn,cl=''){return `<button class="${cl}" onclick="${fn}">${t}</button>`}

const pages={
  dashboard:async()=>{
    $('content').innerHTML=`<div class="card hero"><h2>Selamat datang di ${esc(school?.name||'SIS Terpadu')}</h2><p class="sub">Sistem Informasi Sekolah Online Terpadu</p></div>`;
  },
  announcements:async()=>{
    let rows=await q('announcements',{order:['publish_at',false]});
    $('content').innerHTML=tableCard('Pengumuman',['Judul','Audiens','Terbit','Isi'],rows.map(x=>`<tr><td><b>${esc(x.title)}</b></td><td>${esc(x.audience)}</td><td>${fmtDate((x.publish_at||'').slice(0,10))}</td><td>${esc(x.content)}</td></tr>`));
  },
  calendar:async()=>{
    let rows=await q('calendar_events',{order:['start_at',true]});
    $('content').innerHTML=tableCard('Kalender Sekolah',['Agenda','Mulai','Lokasi'],rows.map(x=>`<tr><td><b>${esc(x.title)}</b></td><td>${new Date(x.start_at).toLocaleString('id-ID')}</td><td>${esc(x.location||'-')}</td></tr>`));
  },
  students:()=>masterPage('students','Peserta Didik',['nis','nisn','name','gender','status'],['NIS','NISN','Nama','JK','Status']),
  teachers:()=>masterPage('teachers','Guru',['nip','name','email','status'],['NIP','Nama','Email','Status']),
  classes:()=>masterPage('classes','Kelas',['name','level','academic_year'],['Nama','Tingkat','Tahun Ajaran']),
  subjects:()=>masterPage('subjects','Mata Pelajaran',['name','code','kkm'],['Nama','Kode','KKM']),
  attendance:async()=>{$('content').innerHTML=`<div class="card"><h3>Absensi</h3><p>Form absensi siap digunakan.</p></div>`},
  grades:async()=>{$('content').innerHTML=`<div class="card"><h3>Nilai & Asesmen</h3><p>Form nilai siap digunakan.</p></div>`},
  reports:async()=>{$('content').innerHTML=`<div class="card"><h3>Laporan</h3><p>Modul laporan siap digunakan.</p></div>`}
};

async function masterPage(table,title,fields,labels){
  let rows=await q(table,{order:['created_at',false]});
  let rowsHtml=rows.map(x=>`<tr>${fields.map(f=>`<td>${esc(x[f])}</td>`).join('')}<td>${btn('Hapus',`deleteAny('${table}','${x.id}')`,'danger')}</td></tr>`);
  let head=[...labels,'Aksi'];
  $('content').innerHTML=tableCard(title,head,rowsHtml);
}

async function deleteAny(table,id){
  if(!confirm('Hapus data ini?'))return;
  try{ await del(table,id); route(table); }catch(e){ alert(e.message); }
}

window.onload=init;
</script>
</body>
</html>
