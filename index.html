<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10233f"><link rel="manifest" href="manifest.webmanifest"><title>SI Sekolah Terpadu Offline</title><style>
:root{--n:#10233f;--b:#2563eb;--bg:#f4f7fb;--l:#e5e9f0;--m:#667085;--ok:#15803d}*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:var(--bg);color:#172033}.side{position:fixed;inset:0 auto 0 0;width:245px;background:var(--n);color:white;padding:18px 12px;overflow:auto}.brand{font-weight:800;padding:8px 10px 20px}.brand small{display:block;color:#aebdd2;font-weight:500}.nav h6{color:#8ea3bf;margin:14px 10px 5px}.nav button{width:100%;border:0;background:none;color:#d9e4f3;text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.on{background:#183a63}.main{margin-left:245px;padding:20px}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid var(--l);border-radius:15px;padding:16px}.num{font-size:30px;font-weight:800}.muted{color:var(--m);font-size:12px}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.btn{border:0;border-radius:8px;padding:9px 12px;background:var(--b);color:white;font-weight:700;cursor:pointer}.gray{background:#eef2f7;color:#24334a}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:left}th{font-size:11px;color:var(--m)}.scroll{overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}input,select,textarea{width:100%;padding:9px;border:1px solid #d5dce7;border-radius:8px;background:white}textarea{min-height:75px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.on{display:flex}.box{background:white;border-radius:15px;padding:20px;width:min(800px,100%);max-height:92vh;overflow:auto}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:11px;font-weight:700}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.quick button{border:1px solid var(--l);background:#fff;border-radius:10px;padding:12px;text-align:left}.toast{position:fixed;right:15px;bottom:15px;background:#10233f;color:white;padding:10px 14px;border-radius:9px;display:none}.toast.show{display:block}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#10233f,#2563eb);padding:20px}.loginbox{background:white;border-radius:18px;padding:25px;width:min(430px,100%)}
@media(max-width:850px){.side{width:68px}.brand{font-size:0}.brand small,.nav h6{display:none}.nav button{font-size:0;text-align:center}.nav button:after{content:'•';font-size:22px}.main{margin-left:68px}.grid{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}}@media(max-width:600px){.main{padding:12px}.grid,.quick,.form{grid-template-columns:1fr}.full{grid-column:auto}.top{flex-direction:column}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h1>SI SEKOLAH TERPADU</h1><p class="muted">Offline-first • PWA • IndexedDB</p><label>Nama pengguna</label><input id="uname" value="Guru Demo"><label style="margin-top:10px">Peran</label><select id="urole"><option>GURU</option><option>ADMIN</option><option>KEPALA SEKOLAH</option><option>ORANG TUA</option><option>SISWA</option><option>TAMU</option></select><button class="btn" style="width:100%;margin-top:14px" onclick="login()">Masuk</button><p class="muted">Login ini untuk demo UI. Keamanan produksi perlu backend/identity provider.</p></div></div>
<div id="app" style="display:none"><aside class="side"><div class="brand">SI SEKOLAH TERPADU<small id="mini">Offline</small></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div id="sub" class="muted"></div></div><div><span id="net" class="tag">🟢 Lokal</span> <button class="btn gray" onclick="location.reload()">↻</button> <button class="btn gray" onclick="logout()">Keluar</button></div></div><div id="view"></div></main></div>
<div id="modal" class="modal"><div class="box"><button class="btn gray" style="float:right" onclick="closeM()">Tutup</button><div id="mb"></div></div></div><div id="toast" class="toast"></div>
<script>
const DB='sis-sekolah',ST=['settings','teachers','students','classes','subjects','modules','attendance','grades','followups','audit'];let db,session;
const id=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,5),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{db=r.result;ST.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}function all(s){return new Promise((ok,no)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function put(s,o){return new Promise((ok,no)=>{let r=db.transaction(s,'readwrite').objectStore(s).put(o);r.onsuccess=()=>ok(o);r.onerror=()=>no(r.error)})}function remove(s,k){return new Promise((ok,no)=>{let r=db.transaction(s,'readwrite').objectStore(s).delete(k);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}function one(s,k){return new Promise((ok,no)=>{let r=db.transaction(s).objectStore(s).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function seed(){if(!(await all('settings')).length)await put('settings',{id:'school',name:'Sekolah Anda',head:'Nama Kepala Sekolah',year:'2026/2027',semester:'Ganjil',address:'Alamat sekolah'});if(!(await all('teachers')).length)await put('teachers',{id:'T-001',name:'Muh. Kasim Wattimena, S.Pd.',subject:'Kimia',active:true});if(!(await all('classes')).length)await put('classes',{id:'C-001',name:'XI',phase:'F',year:'2026/2027',semester:'Ganjil'});if(!(await all('subjects')).length)await put('subjects',{id:'SUB-001',name:'Kimia'});if(!(await all('students')).length)for(let i=1;i<=5;i++)await put('students',{id:'S-'+i,name:'Peserta Didik '+i,classId:'C-001',active:true})}
async function start(){await openDB();await seed();session=JSON.parse(localStorage.getItem('sis-session')||'null');if(session)enter();else document.getElementById('login').style.display='grid'}function login(){session={name:uname.value||'Pengguna',role:urole.value};localStorage.setItem('sis-session',JSON.stringify(session));enter()}function logout(){localStorage.removeItem('sis-session');location.reload()}function enter(){loginEl.style.display='none';app.style.display='block';nav.innerHTML=`<h6>UTAMA</h6><button onclick="page('dashboard',this)">Dashboard</button><h6>AKADEMIK</h6><button onclick="page('students',this)">Peserta Didik</button><button onclick="page('classes',this)">Kelas</button><button onclick="page('subjects',this)">Mata Pelajaran</button><button onclick="page('teachers',this)">Guru</button><button onclick="page('modules',this)">📚 Modul Pembelajaran</button><button onclick="page('attendance',this)">📋 Absensi Offline</button><button onclick="page('grades',this)">📊 Nilai & Asesmen</button><h6>LAPORAN</h6><button onclick="page('reports',this)">Laporan</button><button onclick="page('backup',this)">Backup & Restore</button><button onclick="page('status',this)">Status Sistem</button><button onclick="page('settings',this)">Pengaturan</button>`;page('dashboard',nav.querySelector('button'))}
const cfg={students:['students','Peserta Didik',['name','nisn','classId','gender']],classes:['classes','Kelas',['name','phase','year','semester']],subjects:['subjects','Mata Pelajaran',['name','code']],teachers:['teachers','Guru',['nip','name','subject','email']]};
async function page(p,b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');let s=(await all('settings')).find(x=>x.id==='school')||{};mini.textContent=s.name||'Offline';sub.textContent=(s.name||'Sekolah Anda')+' • '+(s.year||'2026/2027')+' • '+(s.semester||'Ganjil');title.textContent={dashboard:'Dashboard',students:'Peserta Didik',classes:'Kelas',subjects:'Mata Pelajaran',teachers:'Guru',modules:'Modul Pembelajaran',attendance:'Absensi Offline',grades:'Nilai & Asesmen Offline',reports:'Laporan',backup:'Backup & Restore',status:'Status Sistem',settings:'Pengaturan'}[p]||p;if(p==='dashboard')return dashboard();if(cfg[p])return master(p);if(p==='modules')return modules();if(p==='attendance')return attendance();if(p==='grades')return grades();if(p==='reports')return reports();if(p==='backup')return backup();if(p==='status')return statusPage();if(p==='settings')return settings()}
async function dashboard(){let [st,te,cl,mo,at,gr]=await Promise.all(ST.slice(1,7).map(all));view.innerHTML=`<div class="grid"><div class="card"><div class="muted">Peserta didik</div><div class="num">${st.length}</div></div><div class="card"><div class="muted">Guru</div><div class="num">${te.length}</div></div><div class="card"><div class="muted">Kelas</div><div class="num">${cl.length}</div></div><div class="card"><div class="muted">Modul</div><div class="num">${mo.length}</div></div></div><div class="quick"><button onclick="page('attendance')"><b>📋 Absensi Hari Ini</b><span class="muted">100% offline</span></button><button onclick="page('grades')"><b>📊 Input Nilai</b><span class="muted">Auto-save lokal</span></button><button onclick="newModule()"><b>📚 Buat Modul</b><span class="muted">Materi & LKPD</span></button><button onclick="page('backup')"><b>💾 Backup</b><span class="muted">JSON lokal</span></button></div><div class="panel" style="margin-top:14px"><h3>Alur terpadu</h3><p class="muted">Guru → Kelas → Peserta Didik → Modul → Absensi → Asesmen → Nilai → Rekap → Laporan.</p></div>`}
async function master(p){let [s,l,c]=cfg[p],a=await all(s);view.innerHTML=`<div class="panel"><div class="toolbar"><b>${l}</b><button class="btn" onclick="openMaster('${p}')">+ Tambah</button></div><div class="scroll"><table><tr><th>ID</th>${c.map(x=>`<th>${x}</th>`).join('')}<th></th></tr>${a.map(r=>`<tr><td>${esc(r.id)}</td>${c.map(x=>`<td>${esc(r[x])}</td>`).join('')}<td><button class="btn red" onclick="delRow('${s}','${r.id}','${p}')">Hapus</button></td></tr>`).join('')}</table></div></div>`}
async function openMaster(p){let [s,l,c]=cfg[p];let classes=await all('classes');mb.innerHTML=`<h2>Tambah ${l}</h2><form id="mf" class="form">${c.map(x=>`<div><label>${x}</label>${x==='classId'?`<select name="${x}">${classes.map(k=>`<option value="${k.id}">${esc(k.name)}</option>`).join('')}</select>`:`<input name="${x}">`}</div>`).join('')}</form><div style="text-align:right;margin-top:12px"><button class="btn" onclick="saveMaster('${p}')">Simpan</button></div>`;modal.classList.add('on')}
async function saveMaster(p){let [s]=cfg[p],o={id:id(s.slice(0,3))};new FormData(mf).forEach((v,k)=>o[k]=v);await put(s,o);closeM();toast('✓ Tersimpan');page(p)}async function delRow(s,k,p){if(confirm('Hapus data?')){await remove(s,k);page(p)}}
async function modules(){let a=await all('modules');view.innerHTML=`<div class="panel"><div class="toolbar"><b>📚 Modul Pembelajaran</b><button class="btn" onclick="newModule()">+ Modul Baru</button></div>${a.length?`<div class="scroll"><table><tr><th>Nama</th><th>Mapel</th><th>Kelas</th><th>Materi</th><th>Status</th><th></th></tr>${a.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.subject)}</td><td>${esc(m.className)}</td><td>${esc(m.material)}</td><td>${m.archived?'Arsip':'Aktif'}</td><td><button class="btn gray" onclick="newModule('${m.id}')">Edit</button> <button class="btn gray" onclick="dupModule('${m.id}')">Duplikat</button></td></tr>`).join('')}</table></div>`:'<div class="muted">Belum ada modul.</div>'}</div>`}
async function newModule(key){let m=key?await one('modules',key):{};let fields=[['name','Nama modul'],['subject','Mata pelajaran'],['className','Kelas'],['phase','Fase'],['semester','Semester'],['year','Tahun pelajaran'],['teacher','Nama guru'],['material','Materi'],['objective','Tujuan pembelajaran'],['question','Pertanyaan pemantik'],['activity','Aktivitas pembelajaran'],['lkpd','LKPD'],['media','Media pembelajaran'],['assessment','Asesmen'],['reflection','Refleksi'],['enrichment','Pengayaan'],['remedial','Remedial'],['source','Sumber belajar']];let ta=['objective','question','activity','lkpd','media','assessment','reflection','enrichment','remedial','source'];mb.innerHTML=`<h2>${key?'Edit':'Modul Baru'}</h2><form id="modf" class="form">${fields.map(([k,l])=>`<div class="${ta.includes(k)?'full':''}"><label>${l}</label>${ta.includes(k)?`<textarea name="${k}">${esc(m[k])}</textarea>`:`<input name="${k}" value="${esc(m[k])}">`}</div>`).join('')}</form><div style="text-align:right;margin-top:12px"><button class="btn" onclick="saveModule('${key||''}')">Simpan</button></div>`;modal.classList.add('on')}
async function saveModule(key){let o={id:key||id('MOD'),archived:false,createdAt:new Date().toISOString()};new FormData(modf).forEach((v,k)=>o[k]=v);await put('modules',o);closeM();toast('✓ Modul tersimpan');page('modules')}async function dupModule(k){let o=await one('modules',k);o.id=id('MOD');o.name+=' (Salinan)';await put('modules',o);page('modules')}
async function attendance(){let [cl,sub,st]=await Promise.all(['classes','subjects','students'].map(all));view.innerHTML=`<div class="panel"><div class="toolbar"><b>📋 Absensi Offline</b><span class="tag">🟢 Tersimpan Lokal</span></div><form id="ah" class="form"><div><label>Tahun Pelajaran</label><input name="year" value="2026/2027"></div><div><label>Semester</label><input name="semester" value="Ganjil"></div><div><label>Kelas</label><select name="classId" onchange="loadAtt()">${cl.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>Mata Pelajaran</label><select name="subject">${sub.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div><label>Tanggal</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Jam Pelajaran</label><input name="period" placeholder="1-2"></div></form><div class="toolbar"><button class="btn green" onclick="allHadir()">SEMUA HADIR</button><button class="btn" onclick="saveAtt()">SIMPAN ABSENSI</button></div><div id="attRows"></div></div>`;loadAtt()}
async function loadAtt(){let c=ah.classId.value,st=(await all('students')).filter(x=>x.classId===c);attRows.innerHTML=`<table><tr><th>No</th><th>Nama</th><th>H</th><th>S</th><th>I</th><th>A</th><th>Catatan</th></tr>${st.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td>${['H','S','I','A'].map(v=>`<td><input type="radio" name="a-${s.id}" value="${v}" ${v==='H'?'checked':''}></td>`).join('')}<td><input id="n-${s.id}"></td></tr>`).join('')}</table>`}function allHadir(){document.querySelectorAll('input[type=radio][value=H]').forEach(x=>x.checked=true)}
async function saveAtt(){let f=new FormData(ah),h={};f.forEach((v,k)=>h[k]=v);let st=(await all('students')).filter(x=>x.classId===h.classId),key=[h.date,h.classId,h.subject,h.period].join('|'),old=(await all('attendance')).find(x=>x.key===key);if(old&&!confirm('Absensi untuk jadwal ini sudah tersedia. Edit?'))return;let items=st.map(s=>({studentId:s.id,name:s.name,status:document.querySelector(`input[name="a-${s.id}"]:checked`)?.value||'H',note:document.getElementById('n-'+s.id)?.value||''}));await put('attendance',{id:old?old.id:id('ATT'),key,...h,items,savedAt:new Date().toISOString()});toast('✓ Absensi tersimpan lokal')}
async function grades(){let [cl,sub,st]=await Promise.all(['classes','subjects','students'].map(all));view.innerHTML=`<div class="panel"><div class="toolbar"><b>📊 Nilai & Asesmen Offline</b><span class="tag">🟢 Auto-save lokal</span></div><form id="gh" class="form"><div><label>Tahun</label><input name="year" value="2026/2027"></div><div><label>Semester</label><input name="semester" value="Ganjil"></div><div><label>Kelas</label><select name="classId" onchange="loadGrades()">${cl.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>Mata Pelajaran</label><select name="subject">${sub.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div><label>Jenis asesmen</label><select name="type"><option>Tugas</option><option>LKPD</option><option>Kuis</option><option>Asesmen Formatif</option><option>Asesmen Sumatif</option><option>Praktik</option><option>Projek</option><option>Portofolio</option><option>Presentasi</option></select></div><div><label>Materi</label><input name="material"></div><div><label>Tanggal</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}"></div></form><div id="gradeRows"></div></div>`;loadGrades()}
async function loadGrades(){let st=(await all('students')).filter(x=>x.classId===gh.classId.value);gradeRows.innerHTML=`<table><tr><th>No</th><th>Nama</th><th>Nilai</th><th>Catatan</th></tr>${st.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td><input class="gv" data-s="${s.id}" type="number" min="0" max="100"></td><td><input class="gn" data-s="${s.id}"></td></tr>`).join('')}</table><div style="margin-top:10px"><button class="btn" onclick="saveGrades()">SIMPAN SEMUA</button></div>`}async function saveGrades(){let f=new FormData(gh),h={};f.forEach((v,k)=>h[k]=v);for(let x of document.querySelectorAll('.gv')){let sid=x.dataset.s;await put('grades',{id:id('GRD'),...h,studentId:sid,value:Number(x.value||0),note:document.querySelector(`.gn[data-s="${sid}"]`).value,savedAt:new Date().toISOString()})}toast('✓ Nilai tersimpan lokal')}
async function reports(){let [st,at,gr]=await Promise.all(['students','attendance','grades'].map(all)),m={};st.forEach(s=>m[s.id]={name:s.name,H:0,S:0,I:0,A:0});at.forEach(a=>a.items?.forEach(i=>{if(m[i.studentId])m[i.studentId][i.status]++}));let g={};gr.forEach(x=>(g[x.studentId]??=[]).push(x.value));view.innerHTML=`<div class="panel"><div class="toolbar"><b>Rekap Absensi & Nilai</b><button class="btn gray" onclick="print()">Cetak/PDF</button></div><table><tr><th>Nama</th><th>H</th><th>S</th><th>I</th><th>A</th><th>% Hadir</th><th>Rata-rata Nilai</th></tr>${Object.entries(m).map(([k,x])=>{let n=x.H+x.S+x.I+x.A,p=n?(x.H/n*100).toFixed(1):0,a=g[k]?.length?(g[k].reduce((a,b)=>a+b,0)/g[k].length).toFixed(1):'-';return`<tr><td>${esc(x.name)}</td><td>${x.H}</td><td>${x.S}</td><td>${x.I}</td><td>${x.A}</td><td>${p}%</td><td>${a}</td></tr>`}).join('')}</table></div>`}
async function backup(){view.innerHTML=`<div class="panel"><h2>Backup & Restore Lokal</h2><p class="muted">Semua data IndexedDB dapat disimpan menjadi JSON dan dipulihkan kembali.</p><button class="btn" onclick="doBackup()">BACKUP LOKAL</button><label class="btn gray" style="display:inline-block;margin-left:7px">RESTORE <input type="file" hidden accept=".json" onchange="doRestore(this.files[0])"></label></div>`}async function doBackup(){let o={version:1,createdAt:new Date().toISOString(),stores:{}};for(let s of ST)o.stores[s]=await all(s);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='backup-sekolah.json';a.click()}async function doRestore(f){if(!f)return;let o=JSON.parse(await f.text());for(let s of ST)for(let r of o.stores[s]||[])await put(s,r);toast('✓ Restore selesai')}
async function statusPage(){view.innerHTML=`<div class="grid"><div class="card"><b>Database</b><p class="tag">🟢 IndexedDB</p></div><div class="card"><b>PWA</b><p class="tag">🟢 Service Worker</p></div><div class="card"><b>Internet</b><p id="internet" class="tag"></p></div><div class="card"><b>Mode</b><p class="tag">🟢 Offline-first</p></div></div><div class="panel" style="margin-top:14px"><h3>Uji Offline</h3><ol><li>Matikan internet.</li><li>Isi absensi.</li><li>Input nilai.</li><li>Tutup aplikasi.</li><li>Buka kembali dan cek data.</li></ol></div>`;internet.textContent=navigator.onLine?'🟢 Tersedia':'🔴 Tidak tersedia'}
async function settings(){let s=(await all('settings')).find(x=>x.id==='school')||{};view.innerHTML=`<div class="panel"><h2>Identitas Sekolah</h2><form id="sf" class="form"><div><label>Nama sekolah</label><input name="name" value="${esc(s.name)}"></div><div><label>Kepala sekolah</label><input name="head" value="${esc(s.head)}"></div><div class="full"><label>Alamat</label><textarea name="address">${esc(s.address)}</textarea></div><div><label>Tahun pelajaran</label><input name="year" value="${esc(s.year)}"></div><div><label>Semester</label><input name="semester" value="${esc(s.semester)}"></div></form><div style="text-align:right;margin-top:10px"><button class="btn" onclick="saveSettings()">Simpan</button></div></div>`}async function saveSettings(){let o={id:'school'};new FormData(sf).forEach((v,k)=>o[k]=v);await put('settings',o);toast('✓ Pengaturan tersimpan');page('dashboard')}
function closeM(){modal.classList.remove('on')}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}window.addEventListener('offline',()=>net.textContent='🔴 Offline');window.addEventListener('online',()=>net.textContent='🟢 Online');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});start();
</script></body></html>
